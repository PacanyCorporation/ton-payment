version: '3'

services:

  # Закомментировано - используем вашу существующую БД durak-postgres
  # payment-postgres:
  #   image: postgres:14
  #   container_name: payment_processor_db
  #   volumes:
  #   - ./deploy/db/01_init.up.sql:/docker-entrypoint-initdb.d/01_init.up.sql
  #   - ./deploy/db/02_create_readonly_user.sh:/docker-entrypoint-initdb.d/02_create_readonly_user.sh
  #   - bicycle-postgres:/var/lib/postgresql/data
  #   restart: always
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD} # For grafana
  #   networks:
  #     - p-network

  payment-processor:
    image: payment-processor
    container_name: payment_processor
    ports:
      - "127.0.0.1:8081:${API_PORT}"
    restart: unless-stopped
    environment:
      DB_URI: ${DB_URI} # Подключается к durak-postgres
      API_PORT: ${API_PORT}
      API_TOKEN: ${API_TOKEN}
      COLD_WALLET: ${COLD_WALLET}
      JETTONS: ${JETTONS}
      LITESERVERS_CONFIG_URL: ${LITESERVERS_CONFIG_URL}
      LITESERVER: ${LITESERVER}
      LITESERVER_KEY: ${LITESERVER_KEY}
      NETWORK_CONFIG_URL: ${NETWORK_CONFIG_URL}
      SEED: ${SEED}
      TON_CUTOFFS: ${TON_CUTOFFS}
      IS_TESTNET: ${IS_TESTNET}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      ALERTS_REDIS_URL: ${ALERTS_REDIS_URL:-}
      ALERTS_REDIS_PASSWORD: ${ALERTS_REDIS_PASSWORD:-}
      ALERTS_REDIS_DB: ${ALERTS_REDIS_DB:-15}
      ALERTS_PROJECT: ${ALERTS_PROJECT:-durak}
      ALERTS_STREAM: ${ALERTS_STREAM:-alerts}
    networks:
      - p-network
      - durak-network-dev  # Подключаемся к вашей сети для доступа к durak-postgres
    depends_on:
      - durak-postgres  # Ждем запуска вашей БД

  payment-grafana:
    image: grafana/grafana:latest
    container_name: payment_grafana
    restart: always
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./deploy/grafana/main/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./deploy/grafana/main/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./deploy/grafana/main/dashboards:/etc/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: admin # TODO: change
      GF_SECURITY_ADMIN_PASSWORD: admin # TODO: change
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD}
    networks:
      - p-network

  payment-rabbitmq:
    image: library/rabbitmq:3-management
    container_name: payment_rabbitmq
    restart: always
    ports:
      - '127.0.0.1:5672:5672'
    networks:
      - p-network

  payment-prometheus:
    image: prom/prometheus:latest
    container_name: payment_prometheus
    restart: always
    volumes:
      - ./deploy/prometheus/main:/etc/prometheus
    user: "$UID:$GID"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - p-network

networks:
  p-network:
    driver: bridge
  # Подключаемся к вашим существующим сетям
  durak-network-dev:
    external: true
  durak-network-prod:
    external: true

volumes:
  bicycle-postgres:
    external: false