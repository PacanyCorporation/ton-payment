permissions:
  packages: write
  contents: read

name: Deploy docker image

on:
  push:
    branches: [main]

# Serialize deploys per repository; never cancel an in-flight deploy.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (:sha and :latest)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DOCKER_BUILDKIT=1 docker build --ssh default -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy over SSH (forced-command ci-deploy.sh)
        run: |
          install -m 600 /dev/stdin key <<< "${{ secrets.VPS_SSH_KEY }}"
          install -m 644 /dev/stdin known_hosts <<< "${{ secrets.VPS_KNOWN_HOSTS }}"
          REPO=${GITHUB_REPOSITORY#*/}
          COMMITS_B64=$(jq -c '[(.commits // [])[-20:][] | {sha: (.id[0:7]), msg: ((.message | split("\n")[0])[0:120]), author: .author.name}]' "$GITHUB_EVENT_PATH" | base64 -w0)
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i key -o UserKnownHostsFile=known_hosts \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "$REPO ${{ github.sha }} ${{ github.actor }} $COMMITS_B64"
